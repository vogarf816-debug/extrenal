<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VesperDash</title><style>
:root{font-family:Inter,system-ui;background:#0e1220;color:#eef2ff}body{max-width:1100px;margin:0 auto;padding:28px}h1{margin:0 0 6px}.muted{color:#9ba7c5}.card{background:#171d31;border:1px solid #293452;border-radius:16px;padding:20px;margin:18px 0}input,select,button{border-radius:9px;border:1px solid #3a486d;background:#0f1526;color:#fff;padding:10px}input,select{width:100%;box-sizing:border-box;margin:5px 0 12px}button{background:#5865f2;border:0;cursor:pointer;font-weight:700}button.danger{background:#a33d58}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.patch{display:flex;justify-content:space-between;gap:15px;align-items:center;border-top:1px solid #293452;padding:14px 0}.pill{padding:4px 8px;border-radius:999px;background:#283553;font-size:12px}.on{background:#176b4c}.off{background:#6b293d}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{padding:7px 10px}@media(max-width:700px){.grid{grid-template-columns:1fr}.patch{display:block}.actions{margin-top:10px}}
</style></head><body><h1>VesperDash</h1><div class="muted">Patch control panel · upload, enable, pause, and replace .3105 packages</div>
<div class="card"><h2>Admin access</h2><input id="token" type="password" placeholder="Admin token"><button onclick="load()">Connect</button><span id="status" class="muted"></span></div>
<div class="card"><h2>Upload / replace patch</h2><form id="form"><div class="grid"><label>ID<input name="id" placeholder="weapons-normal" required></label><label>Name<input name="name" placeholder="WEAPONS HOLO" required></label><label>Game<select name="game"><option>normal</option><option>max</option></select></label><label>Version<input name="version" placeholder="1.0" required></label><label>Bundle ID<select name="bundle_id"><option>com.dts.freefireth</option><option>com.dts.freefiremax</option></select></label><label>Target path<input name="target_path" placeholder="Documents/contentcache/..." required></label></div><label>3105 file<input name="file" type="file" accept=".3105" required></label><button>Upload patch</button></form></div>
<div class="card"><h2>Patch catalog</h2><div id="list" class="muted">Connect to load patches.</div></div>
<script>
const $=s=>document.querySelector(s); const token=()=>$('#token').value; const headers=()=>({'X-Admin-Token':token()});
async function load(){let r=await fetch('/api/admin/patches',{headers:headers()}); if(!r.ok){$('#status').textContent='Connection failed';return} let d=await r.json(); $('#status').textContent=' Connected'; render(d.patches)}
function render(ps){$('#list').innerHTML=ps.map(p=>`<div class="patch"><div><b>${p.name}</b> <span class="pill">${p.game}</span> <span class="pill ${p.enabled&&!p.paused?'on':'off'}">${p.enabled?(p.paused?'PAUSED':'ON'):'OFF'}</span><div class="muted">${p.id} · v${p.version} · ${p.filename}</div><div class="muted">${p.bundle_id}<br>${p.target_path}</div></div><div class="actions"><button onclick="state('${p.id}',{enabled:${!p.enabled}})">${p.enabled?'OFF':'ON'}</button><button onclick="state('${p.id}',{paused:${!p.paused}})">${p.paused?'RESUME':'PAUSE'}</button><button class="danger" onclick="removePatch('${p.id}')">DELETE</button></div></div>`).join('')||'<span class="muted">No patches yet.</span>'}
async function state(id,body){await fetch('/api/admin/patches/'+id+'/state',{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify(body)});load()}
async function removePatch(id){if(confirm('Delete this patch?')){await fetch('/api/admin/patches/'+id,{method:'DELETE',headers:headers()});load()}}
$('#form').onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/admin/patches',{method:'POST',headers:headers(),body:new FormData(e.target)});alert(r.ok?'Uploaded':'Upload failed: '+await r.text());if(r.ok){e.target.reset();load()}}
</script></body></html>
