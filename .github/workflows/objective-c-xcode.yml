name: Xcode - Build and Analyze (no server secrets)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and analyze iOS app
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Verify embedded localization table
        run: python3 generate_embedded_localizations.py --check
      - name: Runtime localization smoke test
        run: |
          swiftc ThreeOneOSFive/helpers/EmbeddedLocalizations.generated.swift verify_embedded_localizations.swift -o "$RUNNER_TEMP/vesper-localization-test"
          "$RUNNER_TEMP/vesper-localization-test"
      - name: Build
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=''
      - name: Analyze
        run: |
          set -o pipefail
          xcodebuild analyze \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=''
