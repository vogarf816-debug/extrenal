name: Build VESPER IPA with server-side activation

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install server test dependencies
        run: |
          python3 -m venv .venv-server-tests
          .venv-server-tests/bin/python -m pip install -r vesperdash/requirements.txt

      - name: Validate VPS deployment scripts
        run: bash -n vesperdash/deploy_from_vps.sh vesperdash/deploy_update.sh vesperdash/reset_dashboard_admin.sh

      - name: Test authenticated client API
        run: .venv-server-tests/bin/python -m unittest discover -s vesperdash -v

      - name: Verify embedded localization table
        run: python3 generate_embedded_localizations.py --check

      - name: Runtime localization smoke test
        run: |
          swiftc ThreeOneOSFive/helpers/EmbeddedLocalizations.generated.swift verify_embedded_localizations.swift -o "$RUNNER_TEMP/vesper-localization-test"
          "$RUNNER_TEMP/vesper-localization-test"

      - name: Verify private storage and server-side activation configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          with Path("ThreeOneOSFive/Info.plist").open("rb") as stream:
              info = plistlib.load(stream)
          assert info.get("UIFileSharingEnabled") is False
          assert info.get("LSSupportsOpeningDocumentsInPlace") is False
          assert not any(str(key).startswith("M3SB_") for key in info)
          project = Path("ThreeOneOSFive.xcodeproj/project.pbxproj").read_text()
          release = project.split("3105A602 /* Release */ = {", 1)[1].split("name = Release;", 1)[0]
          for setting in ("COPY_PHASE_STRIP = YES;", "STRIP_INSTALLED_PRODUCT = YES;", 'SWIFT_OPTIMIZATION_LEVEL = "-O";', "SWIFT_COMPILATION_MODE = wholemodule;"):
              assert setting in release, setting
          for source in ("ThreeOneOSFive/helpers/PatchProjectLibrary.swift", "ThreeOneOSFive/helpers/PatchWorkspaceService.swift"):
              text = Path(source).read_text()
              assert 'protectedStoreDirectory = ".7c91e4a2"' in text
              assert "FileProtectionType.complete" in text
          assert 'appendingPathComponent(".p"' in Path("ThreeOneOSFive/helpers/PatchProjectLibrary.swift").read_text()
          assert 'appendingPathComponent(".w"' in Path("ThreeOneOSFive/helpers/PatchWorkspaceService.swift").read_text()
          assert "FileProtectionType.complete" in Path("ThreeOneOSFive/helpers/PatchTransaction.swift").read_text()
          assert 'if item.hasPrefix(".") { continue }' in Path("ThreeOneOSFive/helpers/ContainerStore.swift").read_text()
          store = Path("ThreeOneOSFive/helpers/PatchProjectStore.swift").read_text()
          catalog_sync = store.split("func syncVesperDash(", 1)[1].split("func remotePatchKey(", 1)[0]
          assert "downloadPackageFile" not in catalog_sync
          assert "installImportedPackage" not in catalog_sync
          remote_prepare = store.split("func prepareRemoteProject(", 1)[1].split("private func pruneDownloadedRemotePackages", 1)[0]
          assert "downloadPackageFile" in remote_prepare
          assert "installImportedPackage" not in remote_prepare
          assert 'appendingPathComponent("vesper-inject-' in remote_prepare
          assert "RemotePackageVault.load(for: remote)" in remote_prepare
          assert "RemotePackageVault.store(packageData, for: remote)" in remote_prepare
          vault = store.split("enum RemotePackageVault {", 1)[1].split("struct PatchStoreAlert", 1)[0]
          assert "AES.GCM.seal" in vault and "AES.GCM.open" in vault
          assert "PatchKeyStore.remoteVaultEncryptionKey" in vault
          key_store = Path("ThreeOneOSFive/helpers/PatchKeyStore.swift").read_text()
          assert "remoteVaultEncryptionKey(createIfMissing: Bool = true)" in key_store
          library = Path("ThreeOneOSFive/helpers/PatchProjectLibrary.swift").read_text()
          assert 'appendingPathComponent(".v"' in library
          assert 'appendingPathComponent(".cache"' in library
          ui = Path("ThreeOneOSFive/ContentView.swift").read_text()
          assert "patchCard(" in ui
          assert 'Text(isEnabled ? "INJECTED" : target)' in ui
          assert "injectRemotePatch(remote, targetBundleID: targetBundleID)" in ui
          assert ".frame(width: 92, height: 32, alignment: .center)" in ui
          assert ".shadow(color: .clear, radius: 0, y: 0)" in ui
          assert "CATALOG FAILED — TAP TO RETRY" not in ui
          assert "INJECT STATUS" not in ui
          assert "patchStatusBanner" not in ui
          assert "patchMessage" not in ui
          assert "RESTORING…" in ui
          assert "hasPreparedRemoteProject" in ui
          manager = Path("ThreeOneOSFive/helpers/LicenseManager.swift").read_text()
          vault_strings = Path("ThreeOneOSFive/helpers/VesperDashRemoteSync.swift").read_text()
          assert "M3SB_PACKAGE_TOKEN" not in manager and "M3SB_HMAC_SECRET" not in manager
          assert "M3SB_PACKAGE_TOKEN_OBFUSCATED" not in manager and "M3SB_HMAC_SECRET_OBFUSCATED" not in manager
          assert "client/session/bridge" not in manager
          assert "m3sbAPIBaseURL" not in vault_strings and "m3sbVerifyPath" not in vault_strings
          dashboard = Path("vesperdash/static/index.html").read_text()
          assert "Use legacy admin token" not in dashboard and "X-Admin-Token" not in dashboard
          assert "--new-admin" in Path("vesperdash/deploy_from_vps.sh").read_text()
          assert Path("vesperdash/reset_dashboard_admin.sh").is_file()
          print("Verified: encrypted private storage and server-side-only M3SB credentials; admin dashboard uses account login.")
          PY

      - name: Build unsigned IPA
        run: |
          chmod +x build_unsigned.sh build_esign_ready_ipa.sh
          ./build_unsigned.sh

      - name: Prepare IPA
        run: ./build_esign_ready_ipa.sh build/VESPER-Build-35-unsigned.ipa

      - name: Verify no provider secrets or raw API endpoints in IPA
        run: |
          set -euo pipefail
          rm -rf /tmp/vesper-ipa-check
          mkdir -p /tmp/vesper-ipa-check
          unzip -q build/VESPER-Build-35-unsigned.ipa -d /tmp/vesper-ipa-check
          APP_DIR="$(find /tmp/vesper-ipa-check/Payload -maxdepth 1 -name '*.app' -type d -print -quit)"
          APP_PLIST="$APP_DIR/Info.plist"
          APP_EXECUTABLE="$APP_DIR/VESPER"
          test "$(basename "$APP_DIR")" = "VESPER.app"
          test -f "$APP_PLIST"
          test -f "$APP_EXECUTABLE"
          if find "$APP_DIR" -type d -name '*.lproj' -print -quit | grep -q .; then
            echo 'Localized .lproj folders should be embedded in the VESPER executable.' >&2
            exit 1
          fi
          EXECUTABLE_BYTES="$(wc -c < "$APP_EXECUTABLE" | tr -d ' ')"
          test "$EXECUTABLE_BYTES" -ge 690000000 || { echo '690 MB executable padding is missing' >&2; exit 1; }
          python3 embed_app_resources.py --verify "$APP_DIR"
          python3 - "$APP_DIR" "$APP_PLIST" <<'PY'
          import plistlib
          import sys
          from pathlib import Path

          app_dir = Path(sys.argv[1])
          plist_path = Path(sys.argv[2])
          with plist_path.open("rb") as stream:
              info = plistlib.load(stream)
          if info.get("CFBundleVersion") != "35":
              raise SystemExit("Expected VESPER Build 35.")
          if info.get("CFBundleDisplayName") != "VESPER" or info.get("CFBundleExecutable") != "VESPER":
              raise SystemExit("The VESPER app display name or executable name is incorrect.")
          if info.get("UIFileSharingEnabled") or info.get("LSSupportsOpeningDocumentsInPlace"):
              raise SystemExit("App-wide Documents sharing must remain disabled.")
          if any(str(key).startswith("M3SB_") for key in info):
              raise SystemExit("M3SB configuration must not appear in Info.plist.")
          def reveal(values):
              return bytes(value ^ 0x5A for value in values)
          needles = (
              reveal([59, 42, 51, 116, 55, 105, 41, 56, 59, 42, 51, 116, 41, 50, 53, 42]),
              reveal([117, 59, 42, 51, 117, 41, 62, 49, 117, 44, 63, 40, 51, 60, 35]),
              reveal([59, 42, 51, 116, 44, 63, 41, 42, 63, 40, 62, 59, 41, 50, 116, 57, 53, 55]),
              b"/api/client/session/bridge",
              b"M3SB_PACKAGE_TOKEN",
              b"M3SB_HMAC_SECRET",
          )
          overlap_size = max(map(len, needles)) - 1
          for path in app_dir.rglob("*"):
              if not path.is_file():
                  continue
              overlap = b""
              with path.open("rb") as stream:
                  while True:
                      chunk = stream.read(1024 * 1024)
                      if not chunk:
                          break
                      data = overlap + chunk
                      if any(needle in data for needle in needles):
                          raise SystemExit("Provider secrets or a raw M3SB/API endpoint was found in the app bundle.")
                      overlap = data[-overlap_size:] if overlap_size > 0 else b""
          if any(path.is_file() and path.suffix.lower() == ".3105" for path in app_dir.rglob("*")):
              raise SystemExit("A patch package was found inside the IPA.")
          print("Verified: Build 35 contains no M3SB credentials, raw provider endpoints, or patch packages.")
          PY
          IPA_BYTES="$(wc -c < build/VESPER-Build-35-unsigned.ipa | tr -d ' ')"
          echo "Compressed IPA size: ${IPA_BYTES} bytes"

      - name: Publish IPA release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="vesper-build-${GITHUB_RUN_ID}"
          gh release create "$TAG" build/VESPER-Build-35-unsigned.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --title "VESPER Build ${GITHUB_RUN_ID}" \
            --notes "Unsigned VESPER Build 35 with server-side licensing, built from ${GITHUB_SHA}." \
            --target "$GITHUB_SHA"
