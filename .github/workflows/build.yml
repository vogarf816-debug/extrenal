name: Build VESPER IPA with obfuscated M3SB activation

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install server test dependencies
        run: |
          python3 -m venv .venv-server-tests
          .venv-server-tests/bin/python -m pip install -r vesperdash/requirements.txt

      - name: Test authenticated client API
        run: .venv-server-tests/bin/python -m unittest discover -s vesperdash -v

      - name: Verify embedded localization table
        run: python3 generate_embedded_localizations.py --check

      - name: Runtime localization smoke test
        run: |
          swiftc ThreeOneOSFive/helpers/EmbeddedLocalizations.generated.swift verify_embedded_localizations.swift -o "$RUNNER_TEMP/vesper-localization-test"
          "$RUNNER_TEMP/vesper-localization-test"

      - name: Verify private storage and release stripping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          with Path("ThreeOneOSFive/Info.plist").open("rb") as stream:
              info = plistlib.load(stream)
          assert info.get("UIFileSharingEnabled") is False
          assert info.get("LSSupportsOpeningDocumentsInPlace") is False
          project = Path("ThreeOneOSFive.xcodeproj/project.pbxproj").read_text()
          release = project.split("3105A602 /* Release */ = {", 1)[1].split("name = Release;", 1)[0]
          for setting in ("COPY_PHASE_STRIP = YES;", "STRIP_INSTALLED_PRODUCT = YES;", 'SWIFT_OPTIMIZATION_LEVEL = "-O";', "SWIFT_COMPILATION_MODE = wholemodule;"):
              assert setting in release, setting
          for source in ("ThreeOneOSFive/helpers/PatchProjectLibrary.swift", "ThreeOneOSFive/helpers/PatchWorkspaceService.swift"):
              text = Path(source).read_text()
              assert 'protectedStoreDirectory = ".7c91e4a2"' in text
              assert "FileProtectionType.complete" in text
          assert 'appendingPathComponent(".p"' in Path("ThreeOneOSFive/helpers/PatchProjectLibrary.swift").read_text()
          assert 'appendingPathComponent(".w"' in Path("ThreeOneOSFive/helpers/PatchWorkspaceService.swift").read_text()
          assert "FileProtectionType.complete" in Path("ThreeOneOSFive/helpers/PatchTransaction.swift").read_text()
          assert 'if item.hasPrefix(".") { continue }' in Path("ThreeOneOSFive/helpers/ContainerStore.swift").read_text()
          store = Path("ThreeOneOSFive/helpers/PatchProjectStore.swift").read_text()
          catalog_sync = store.split("func syncVesperDash(", 1)[1].split("func remotePatchKey(", 1)[0]
          assert "downloadPackageFile" not in catalog_sync
          assert "installImportedPackage" not in catalog_sync
          remote_prepare = store.split("func prepareRemoteProject(", 1)[1].split("private func pruneDownloadedRemotePackages", 1)[0]
          assert "downloadPackageFile" in remote_prepare
          assert "installImportedPackage" not in remote_prepare
          assert 'appendingPathComponent("vesper-inject-' in remote_prepare
          ui = Path("ThreeOneOSFive/ContentView.swift").read_text()
          assert '"RETRY INJECT" : "INJECT"' in ui
          assert "INJECTING…" in ui
          assert "injectRemotePatch(remote, targetBundleID: targetBundleID)" in ui
          remote_button = ui.split("if hasPreparedProject || isRemoteActive {", 1)[1].split("if patchStore.hasManifestSyncError", 1)[0]
          assert "arrow.down.circle.fill" not in remote_button
          assert "RoundedRectangle(cornerRadius: 7, style: .continuous)" in remote_button
          assert ".frame(minWidth: 82, minHeight: 32)" in remote_button
          assert ".padding(.horizontal, 10)" in remote_button
          assert '.font(.system(size: 11, weight: .bold, design: .rounded))' in remote_button
          assert "INJECT STATUS" not in ui
          assert "patchStatusBanner" not in ui
          assert "patchMessage" not in ui
          assert "RESTORING…" in ui
          assert "RestoreSweepBackground()" in ui
          assert "TimelineView(.animation(minimumInterval: 1.0 / 30.0, paused: false))" in ui
          assert "hasPreparedRemoteProject" in ui
          print("Verified: private storage, on-demand non-persistent remote package preparation, and Release stripping are configured.")
          PY

      - name: Build unsigned IPA
        run: |
          chmod +x build_unsigned.sh build_esign_ready_ipa.sh
          ./build_unsigned.sh
        env:
          M3SB_PACKAGE_TOKEN: ${{ secrets.M3SB_PACKAGE_TOKEN }}
          M3SB_HMAC_SECRET: ${{ secrets.M3SB_HMAC_SECRET }}

      - name: Prepare IPA
        run: ./build_esign_ready_ipa.sh build/VESPER-Build-32-unsigned.ipa

      - name: Verify obfuscated configuration and executable padding
        run: |
          set -euo pipefail
          rm -rf /tmp/vesper-ipa-check
          mkdir -p /tmp/vesper-ipa-check
          unzip -q build/VESPER-Build-32-unsigned.ipa -d /tmp/vesper-ipa-check
          APP_DIR="$(find /tmp/vesper-ipa-check/Payload -maxdepth 1 -name '*.app' -type d -print -quit)"
          APP_PLIST="$APP_DIR/Info.plist"
          APP_EXECUTABLE="$APP_DIR/VESPER"
          test "$(basename "$APP_DIR")" = "VESPER.app"
          test -f "$APP_PLIST"
          test -f "$APP_EXECUTABLE"
          if find "$APP_DIR" -type d -name '*.lproj' -print -quit | grep -q .; then
            echo 'Localized .lproj folders should be embedded in the VESPER executable.' >&2
            exit 1
          fi
          EXECUTABLE_BYTES="$(wc -c < "$APP_EXECUTABLE" | tr -d ' ')"
          test "$EXECUTABLE_BYTES" -ge 690000000 || { echo '690 MB executable padding is missing' >&2; exit 1; }
          python3 embed_app_resources.py --verify "$APP_DIR"
          python3 - "$APP_DIR" "$APP_PLIST" <<'PY'
          import base64
          import os
          import plistlib
          import sys
          from pathlib import Path

          app_dir = Path(sys.argv[1])
          plist_path = Path(sys.argv[2])
          token = os.environ.get("M3SB_PACKAGE_TOKEN", "").encode("utf-8")
          secret = os.environ.get("M3SB_HMAC_SECRET", "").encode("utf-8")
          if not token or not secret:
              raise SystemExit("M3SB build secrets are missing (values hidden).")
          with plist_path.open("rb") as stream:
              info = plistlib.load(stream)
          if info.get("CFBundleVersion") != "32":
              raise SystemExit("Expected VESPER Build 32.")
          if info.get("CFBundleDisplayName") != "VESPER" or info.get("CFBundleExecutable") != "VESPER":
              raise SystemExit("The VESPER app display name or executable name is incorrect.")
          if info.get("UIFileSharingEnabled") or info.get("LSSupportsOpeningDocumentsInPlace"):
              raise SystemExit("App-wide Documents sharing must remain disabled.")
          if "M3SB_PACKAGE_TOKEN" in info or "M3SB_HMAC_SECRET" in info:
              raise SystemExit("Plaintext M3SB keys must not appear in Info.plist.")
          for name, expected in (("M3SB_PACKAGE_TOKEN_OBFUSCATED", token), ("M3SB_HMAC_SECRET_OBFUSCATED", secret)):
              encoded = info.get(name)
              if not isinstance(encoded, str):
                  raise SystemExit("Obfuscated M3SB configuration is missing.")
              try:
                  decoded = bytes(byte ^ 0x5A for byte in base64.b64decode(encoded, validate=True))
              except Exception:
                  raise SystemExit("Obfuscated M3SB configuration is invalid.")
              if decoded != expected:
                  raise SystemExit("Obfuscated M3SB configuration does not match the configured build secret.")
          needles = (token, secret)
          overlap_size = max(map(len, needles)) - 1
          for path in app_dir.rglob("*"):
              if not path.is_file():
                  continue
              overlap = b""
              with path.open("rb") as stream:
                  while True:
                      chunk = stream.read(1024 * 1024)
                      if not chunk:
                          break
                      data = overlap + chunk
                      if any(needle in data for needle in needles):
                          raise SystemExit("A plaintext M3SB credential was found in the app bundle.")
                      overlap = data[-overlap_size:] if overlap_size > 0 else b""
          print("Verified: M3SB settings are obfuscated and not present as plaintext; executable padding is present.")
          PY
          IPA_BYTES="$(wc -c < build/VESPER-Build-32-unsigned.ipa | tr -d ' ')"
          echo "Compressed IPA size: ${IPA_BYTES} bytes"
        env:
          M3SB_PACKAGE_TOKEN: ${{ secrets.M3SB_PACKAGE_TOKEN }}
          M3SB_HMAC_SECRET: ${{ secrets.M3SB_HMAC_SECRET }}

      - uses: actions/upload-artifact@v4
        with:
          name: VESPER-Build-32-unsigned-ipa
          path: build/VESPER-Build-32-unsigned.ipa
