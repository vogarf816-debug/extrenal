name: Build secure VESPER IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install server test dependencies
        run: |
          python3 -m venv .venv-server-tests
          .venv-server-tests/bin/python -m pip install -r vesperdash/requirements.txt

      - name: Test authenticated client API
        run: .venv-server-tests/bin/python -m unittest discover -s vesperdash -v

      - name: Build unsigned IPA
        run: |
          chmod +x build_unsigned.sh build_esign_ready_ipa.sh
          ./build_unsigned.sh

      - name: Prepare IPA
        run: ./build_esign_ready_ipa.sh build/VESPER-Build-9-unsigned.ipa

      - name: Verify IPA contains no M3SB credentials
        run: |
          set -euo pipefail
          rm -rf /tmp/vesper-ipa-check
          mkdir -p /tmp/vesper-ipa-check
          unzip -q build/VESPER-Build-9-unsigned.ipa -d /tmp/vesper-ipa-check
          APP_PLIST="$(find /tmp/vesper-ipa-check/Payload -maxdepth 1 -name '*.app' -type d -print -quit)/Info.plist"
          test -f "$APP_PLIST"
          APP_EXECUTABLE="$(dirname "$APP_PLIST")/3105"
          test -f "$APP_EXECUTABLE"
          EXECUTABLE_BYTES="$(wc -c < "$APP_EXECUTABLE" | tr -d ' ')"
          test "$EXECUTABLE_BYTES" -ge 150000000 || { echo 'Executable padding is missing' >&2; exit 1; }
          if /usr/libexec/PlistBuddy -c 'Print :M3SB_PACKAGE_TOKEN' "$APP_PLIST" >/dev/null 2>&1; then echo 'M3SB_PACKAGE_TOKEN must not be embedded' >&2; exit 1; fi
          if /usr/libexec/PlistBuddy -c 'Print :M3SB_HMAC_SECRET' "$APP_PLIST" >/dev/null 2>&1; then echo 'M3SB_HMAC_SECRET must not be embedded' >&2; exit 1; fi
          IPA_BYTES="$(wc -c < build/VESPER-Build-9-unsigned.ipa | tr -d ' ')"
          echo "Verified: no M3SB credentials; executable=${EXECUTABLE_BYTES} bytes; compressed IPA=${IPA_BYTES} bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: VESPER-Build-9-unsigned-ipa
          path: build/VESPER-Build-9-unsigned.ipa
