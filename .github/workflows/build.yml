name: Build HYper key-enabled IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build unsigned IPA
        run: |
          chmod +x build_unsigned.sh build_esign_ready_ipa.sh
          ./build_unsigned.sh

      - name: Prepare IPA
        run: ./build_esign_ready_ipa.sh build/HYper-Regedit-Key-Enabled-unsigned.ipa

      - name: Verify server secrets are absent from IPA
        run: |
          set -euo pipefail
          rm -rf /tmp/hyper-ipa-check
          mkdir -p /tmp/hyper-ipa-check
          unzip -q build/HYper-Regedit-Key-Enabled-unsigned.ipa -d /tmp/hyper-ipa-check
          APP_PLIST="$(find /tmp/hyper-ipa-check/Payload -maxdepth 1 -name '*.app' -type d -print -quit)/Info.plist"
          test -f "$APP_PLIST"
          APP_DIR="$(dirname "$APP_PLIST")"
          for key in M3SB_PACKAGE_TOKEN M3SB_HMAC_SECRET; do
            if /usr/libexec/PlistBuddy -c "Print :$key" "$APP_PLIST" >/dev/null 2>&1; then
              echo "Refusing to publish IPA containing server secret key $key" >&2
              exit 1
            fi
          done
          if grep -R -a -E 'M3SB_PACKAGE_TOKEN|M3SB_HMAC_SECRET' "$APP_DIR" >/dev/null; then
            echo "Refusing to publish IPA containing M3SB credential references" >&2
            exit 1
          fi
          echo "Verified no M3SB server credentials are embedded in the IPA"

      - uses: actions/upload-artifact@v4
        with:
          name: HYper-Regedit-Key-Enabled-unsigned-ipa
          path: build/HYper-Regedit-Key-Enabled-unsigned.ipa
